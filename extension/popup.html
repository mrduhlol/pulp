<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pulp · Music equalizer</title><link rel="stylesheet" href="popup.css"></head><body>
<main><header><div class="identity"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><h1>Pulp<span>®</span></h1><p>A little more feeling.</p></div></div><button id="power" class="power" aria-label="Enable equalizer" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 5.7a9 9 0 1 0 11.4 0"/></svg></button></header>
<section class="connection"><span id="dot"></span><div><strong id="status">Finding your music…</strong><p id="source">Play a song in this tab to get started.</p></div><span class="live">CURRENT TAB</span></section>
<section class="equalizer"><div class="section-title"><h2>Make it yours.</h2><button id="reset" class="text-button">Reset all</button></div><div class="preset-row"><label for="preset">Sound profile</label><select id="preset"><option>Flat</option><option>Warm</option><option>Bass boost</option><option>Vocal</option><option>Electronic</option><option>Rock</option><option>Jazz</option><option>Acoustic</option><option>Custom</option></select></div><div class="graph" aria-hidden="true"><svg viewBox="0 0 400 62" preserveAspectRatio="none"><path id="curve" d="M0 31 L400 31"/></svg><span>+12 dB</span><span>−12 dB</span></div><div id="bands" class="bands"></div><div class="frequency-note"><span>LOW END</span><span>MIDS</span><span>DETAIL</span></div></section>
<section class="tone"><div class="section-title"><h2>The finishing touches</h2><span>FINE TUNE</span></div><div class="tone-grid"><label class="control">Bass boost <output id="bass-value">0 dB</output><input id="bass" type="range" min="0" max="12" value="0"></label><label class="control">Brilliance <output id="treble-value">0 dB</output><input id="treble" type="range" min="0" max="12" value="0"></label></div><label class="control wide">Output level <output id="volume-value">80%</output><input id="volume" type="range" min="0" max="100" value="80"></label><label class="control wide">Stereo balance <output id="balance-value">Center</output><input id="balance" type="range" min="-100" max="100" value="0"><span class="ends"><span>L</span><span>R</span></span></label><div class="limiter"><div><strong>Peak protection</strong><p>Soften loud peaks when boosting your sound.</p></div><button id="limiter" class="switch" role="switch" aria-checked="true" aria-label="Peak protection"><span></span></button></div></section>
<footer><span id="save-status">Settings saved on this device</span><button id="save-preset" class="text-button">Save profile</button></footer><p id="message" class="message" role="status"></p></main><script src="popup.js"></script></body></html>
